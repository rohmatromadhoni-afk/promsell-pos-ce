name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter build apk --debug
      - name: Simpan log Gradle lengkap
        if: failure()
        working-directory: android
        run: bash ./gradlew assembleDebug --stacktrace > ../gradle-log.txt 2>&1 || true

      - name: Upload log Gradle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: promsell-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
