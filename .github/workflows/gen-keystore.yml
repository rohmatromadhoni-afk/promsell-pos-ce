name: Generate Keystore (sekali pakai)

# Jalankan manual satu kali, lalu hapus workflow ini setelah secrets tersimpan.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Buat keystore + kata sandi acak
        shell: bash
        run: |
          set -euo pipefail
          STORE_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"
          KEY_PASS="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 24)"
          mkdir -p out
          keytool -genkeypair -v \
            -keystore out/keystore.jks \
            -storetype JKS \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias barokah \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=Barokah Karangsari, OU=POS, O=Barokah Karangsari, L=Karangsari, ST=Jawa Barat, C=ID"
          base64 -w0 out/keystore.jks > out/keystore.jks.b64
          printf 'KEYSTORE_BASE64_FILE=keystore.jks.b64\nKEYSTORE_PASSWORD=%s\nKEY_ALIAS=barokah\nKEY_PASSWORD=%s\n' \
            "$STORE_PASS" "$KEY_PASS" > out/keystore-info.txt
          rm out/keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: out/
          retention-days: 1
