name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - run: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs

      - name: Siapkan kunci tanda tangan
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 belum diset di repo ini."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/keystore.jks
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/app/keystore.properties
          echo "Keystore siap."

      - run: flutter build apk --release --flavor prod --build-number=${{ github.run_number }}

      - name: Simpan log Gradle lengkap
        if: failure()
        working-directory: android
        run: bash ./gradlew assembleProdRelease --stacktrace > ../gradle-log.txt 2>&1 || true

      - name: Upload log Gradle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: gradle-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: promsell-release-apk
          path: build/app/outputs/flutter-apk/app-prod-release.apk
